name: Daily Data Extraction

on:
  schedule:
    - cron: '0 7 * * *'   # cada día a las 9:00 UTC
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      # 1️⃣ Checkout del repositorio SIN credenciales del bot
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # Muy importante para usar PAT

      # 2️⃣ Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      # 4️⃣ Ejecutar scraper
      #    continue-on-error: si run_extraction.py salta alguna sección
      #    crítica, termina con código != 0, pero dejamos que el job siga
      #    para no perder el commit de las secciones que sí tuvieron éxito.
      #    El paso 7️⃣ vuelve a fallar el job explícitamente al final.
      - name: Run scraper
        id: extract
        continue-on-error: true
        env:
          MISTER_USERNAME: ${{ secrets.MISTER_USERNAME }}
          MISTER_PASSWORD: ${{ secrets.MISTER_PASSWORD }}
          MISTER_BASE_URL: ${{ secrets.MISTER_BASE_URL }}
        run: python scripts/run_extraction.py
      # 5️⃣ Ejecutar preprocessing
      - name: Run preprocessing
        run: python scripts/run_preprocess.py

      # 6️⃣ Commit y push de la base de datos automáticamente usando PAT
      - name: Commit and push database
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Cambiar remote para usar PAT
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git

          git add data/mister.db

          # Solo commit si hay cambios
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update season data [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi

      # 7️⃣ Si el scraper saltó alguna sección crítica, fallar el job ahora
      #    (después de comitear lo que sí se extrajo) para que se abra el
      #    aviso del paso siguiente.
      - name: Fail job if the scraper skipped sections
        if: steps.extract.outcome == 'failure'
        run: |
          echo "::error::run_extraction.py saltó una o más secciones — revisa los logs del paso 'Run scraper'."
          exit 1

      # 8️⃣ Si algo del job anterior falló, abrir/actualizar un issue de aviso
      - name: Notify failure via GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Workflow failure: ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.sha.substring(0, 7);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "automated-failure",
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nuevo fallo en [run #${context.runNumber}](${runUrl}) (commit ${commit}).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["automated-failure"],
                body: `El workflow **${context.workflow}** falló en [run #${context.runNumber}](${runUrl}) (commit ${commit}).\n\nRevisa los logs del job para más detalles. Este issue se reutiliza para fallos siguientes hasta que se cierre.`,
              });
            }
