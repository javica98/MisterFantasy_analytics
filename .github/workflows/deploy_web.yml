name: Deploy Web (mini PC)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "assets/**"
      - "Dockerfile.web"
      - "docker/nginx.web.conf"
      - "docker/security-headers.inc"
  # El commit diario de datos lleva [skip ci], que bloquea el trigger de
  # push de arriba: redesplegamos al terminar la extracción para que la
  # web sirva el app-data.json recién generado.
  workflow_run:
    workflows: ["Daily Data Extraction"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          # Fijamos main para desplegar siempre el último commit, incluido el
          # de datos que la extracción acaba de pushear.
          ref: main

      - name: Build image
        run: docker build -f Dockerfile.web -t ai_center-misterfantasy-web:latest .

      - name: Deploy container
        run: docker compose -f C:\AI_CENTER\docker-compose.yml up -d misterfantasy-web

      - name: Health check
        shell: pwsh
        run: |
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $r = Invoke-WebRequest -Uri http://localhost:8090/ -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Start-Sleep -Seconds 3
          }
          if (-not $ok) { throw "Health check failed: la web no respondio 200 tras el deploy" }
          Write-Host "Health check OK"
