name: Monthly Data Dashboard

on:
  schedule:
    - cron: '0 8 28 * *'   # Cada día 28 a las 9:00 UTC
  workflow_dispatch:

jobs:
  run-monthly-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      # 1️⃣ Checkout del repositorio SIN credenciales del bot
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false  # Muy importante para usar PAT

      # 2️⃣ Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3️⃣ Instalar dependencias
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      
      # 4️⃣ Ejecutar dashboard mensual
      - name: Run monthly dashboard
        run: python scripts/run_monthly_dashboard.py

      # 5️⃣ Commit y push de CSV automáticamente usando PAT
      - name: Commit and push CSVs
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Cambiar remote para usar PAT
          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git

          git add data/processed/*.csv

          # Solo commit si hay cambios
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update CSV data [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi
        # 6️⃣ Commit y push de PDF automáticamente usando PAT
      - name: Commit and push PDF
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          git remote set-url origin https://x-access-token:${PAT_TOKEN}@github.com/${{ github.repository }}.git

          git add dashboards/reports/*.pdf  # carpeta donde guardas tus PDFs

          if ! git diff --cached --quiet; then
            git commit -m "Auto-update monthly dashboard PDF [skip ci]"
            git push origin main
          else
            echo "No changes to commit."
          fi

      # 7️⃣ Si algo del job anterior falló, abrir/actualizar un issue de aviso
      - name: Notify failure via GitHub issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Workflow failure: ${context.workflow}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.sha.substring(0, 7);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "automated-failure",
            });
            const existing = openIssues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nuevo fallo en [run #${context.runNumber}](${runUrl}) (commit ${commit}).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["automated-failure"],
                body: `El workflow **${context.workflow}** falló en [run #${context.runNumber}](${runUrl}) (commit ${commit}).\n\nRevisa los logs del job para más detalles. Este issue se reutiliza para fallos siguientes hasta que se cierre.`,
              });
            }
