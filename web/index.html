    <link rel="icon" type="image/png" sizes="32x32" href="/assets/web/favicon-32.png" />
    <link rel="apple-touch-icon" href="/assets/web/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <body>
    <a class="skip-link" href="#app">Saltar al contenido</a>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <img class="brand-logo" src="/assets/web/logo.webp" alt="" width="88" height="88" />
          <div>
            <strong class="brand-name">Sotano League</strong>
            <span class="brand-tagline">Fútbol fantasy desde el sótano</span>
          </div>
        </div>

        <nav class="side-nav" aria-label="Principal">
          <button type="button" class="nav-item active" data-view="home" aria-current="page">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
            <span>Portada</span>
          </button>
          <button type="button" class="nav-item" data-view="stats">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
            <span>Managers</span>
          </button>
          <button type="button" class="nav-item" data-view="news">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h11v14H6a1 1 0 0 1-1-1z"/><path d="M16 9h3v9a1 1 0 0 1-1 1h-2"/><path d="M8 9h5M8 12h5M8 15h3"/></svg>
            <span>Periódico</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <img class="topbar-logo" src="/assets/web/logo.webp" alt="" width="36" height="36" />
          <h1 id="page-title">Portada</h1>
          <p class="freshness" id="freshness">Cargando…</p>
        </header>

        <section id="app" class="content" tabindex="-1"></section>
      </main>
    </div>

    <dialog class="lightbox" id="lightbox" aria-label="Portada ampliada">
      <form method="dialog" class="lightbox-bar">
        <button type="submit" class="lightbox-close" data-close>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          Cerrar
        </button>
      </form>
      <!-- La imagen la pone app.js al abrir el visor -->
    </dialog>

    <script src="/web/app.js?v=32"></script>
  </body>
