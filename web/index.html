<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sotano League Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.cdnfonts.com/css/coolvetica" rel="stylesheet" />
    <link rel="stylesheet" href="/web/styles.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">
            <img src="/assets/Default.png" alt="Sotano League" />
          </div>
          <div>
            <strong>Sotano League</strong>
            <span>Fantasy Studio</span>
          </div>
        </div>

        <nav class="side-nav" aria-label="Principal" role="tablist">
          <button class="nav-item active" data-view="home" role="tab" aria-selected="true">
            <span class="icon">⌂</span>
            <span>Home</span>
          </button>
          <button class="nav-item" data-view="stats" role="tab" aria-selected="false">
            <span class="icon">📊</span>
            <span>Estadísticas</span>
          </button>
          <button class="nav-item" data-view="news" role="tab" aria-selected="false">
            <span class="icon">📰</span>
            <span>Noticias</span>
          </button>
        </nav>

      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Private Fantasy Analytics</p>
            <h1 id="page-title">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <div class="live-pill"><span></span> Liga viva</div>
          </div>
        </header>

        <section id="app" class="content" aria-live="polite"></section>
      </main>
    </div>

    <script src="/web/app.js?v=3"></script>
  </body>
</html>
