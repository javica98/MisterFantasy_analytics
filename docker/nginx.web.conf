server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types application/json text/css application/javascript;

    # nginx:alpine trae gzip apagado: app-data.json (~270 KB) baja a ~40 KB.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cabeceras de seguridad (CSP, nosniff...). Van en un include porque
    # nginx descarta los add_header del server en cuanto un location define
    # los suyos (los Cache-Control de abajo).
    include /etc/nginx/snippets/security-headers.inc;

    location = / {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
        try_files /web/index.html =404;
    }

    # HTML y datos: siempre revalidar para que un despliegue se vea al
    # momento (el ETag evita volver a descargar si no ha cambiado).
    location = /web/index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }
    location /web/data/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    # CSS/JS van versionados con ?v=N en index.html; imágenes y portadas
    # cambian poco. Un día de caché evita re-descargarlas en cada visita.
    location ~* \.(css|js|png|webp|jpg|jpeg|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.inc;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
